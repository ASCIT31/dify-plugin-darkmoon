    human_description:
      en_US: The Darkmoon campaign id (for example camp_20260922_abc123).
      zh_Hans: Darkmoon 活动 id（例如 camp_20260922_abc123）。
      pt_BR: O id da campanha do Darkmoon (por exemplo camp_20260922_abc123).
