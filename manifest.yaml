  pt_BR: Dispare um teste de intrusao com IA do Darkmoon contra um alvo que voce esta autorizado a avaliar, obtenha os resultados e revise os pull requests de correcao que ele prepara. Conecta a sua Darkmoon Dashboard API auto-hospedada.
